<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Side B Records · listening station</title>
<meta name="description" content="A record player simulated from the groove up, with an FM tuner, on the counter of a record shop. WebGL2 and Web Audio, no dependencies.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e4572e'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23111'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/style.css">
</head>
<body data-source="phono">
<canvas id="gl" aria-label="A record player and radio on the counter of a record shop"></canvas>

<header class="brand"><b>SIDE B</b> RECORDS<span>listening station</span></header>

<div class="views" role="group" aria-label="Camera">
  <button data-view="counter" class="on">Counter</button><button data-view="deck">Deck</button><button data-view="shop">Shop</button>
</div>

<section class="np" aria-live="polite">
  <div id="np-kicker" class="kicker"></div>
  <div id="np-title" class="title"></div>
  <div id="np-sub" class="sub"></div>
  <div id="np-tracks" class="tracks"></div>
</section>

<nav class="bar" aria-label="Controls">
  <div class="seg" role="group" aria-label="Source"><button id="src-phono" class="on">Phono</button><button id="src-radio">FM</button></div>
  <div class="grp phono-only"><button id="play">Start</button><button id="cue" title="Lift or lower the needle (C)">Cue</button><button id="speed" title="Speed (S)">33⅓</button><button id="knock" title="Knock the cabinet (K)">Knock</button></div>
  <div class="grp radio-only"><button id="seek-down" title="Previous station (Shift+←)">◀ Seek</button><button id="seek-up" title="Next station (Shift+→)">Seek ▶</button></div>
  <label class="vol">Vol<input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume"></label>
  <button id="cut" title="Cut your own record from an audio file">Cut a file…</button>
</nav>

<button id="start" class="start">Click anywhere to switch it on <small>sound starts with your first click</small></button>
<div id="toast" class="toast" role="status"></div>
<div id="tip" class="tip"></div>
<div id="fatal" class="fatal" hidden></div>
<input id="file" type="file" accept="audio/*" hidden>

<script type="module" src="src/main.js"></script>
</body>
</html>
